name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip ruff pytest
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Skill format and dash check
        run: python tools/check_skills.py
      - name: Tests
        run: python -m pytest -q
      - name: Evals, deterministic arm only (no model, no network)
        run: python evals/run.py --dry-run
