[project]
name = "investor-skills"
version = "0.1.0"
description = "Three Agent Skills for French real-estate and SME due diligence: the model judges, the script computes."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
evals = ["anthropic>=1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["skills", "tools", "evals"]
addopts = "-q"
